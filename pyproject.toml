[tool.poetry]
name = "living-world-engine"
version = "0.1.0"
description = "AI-powered dynamic world simulation RPG engine"
authors = ["Lee JunYoung"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.1"
pyjwt = "^2.12.1"
bcrypt = "^5.0.0"
email-validator = "^2.3.0"
sqlalchemy = "^2.0.49"
alembic = "^1.18.4"
psycopg2-binary = "^2.9.11"
slowapi = "^0.1.9"
sentry-sdk = {extras = ["fastapi"], version = "^2.58.0"}
replicate = "^1.0.4"
boto3 = "^1.43.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
httpx = "^0.28.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=backend/src --cov-report=html --cov-report=term"
markers = [
    "integration: 통합 테스트 - 실제 API 호출 필요 (deselect with '-m \"not integration\"')",
    "smoke: HTTP API 스모크 (가입→월드→플레이→턴, Stub LLM)",
    "e2e: 엔진 장시간 플로우 (실 Anthropic 키 필요 시 skip)",
    "slow: 느린 테스트",
    "live: 외부 네트워크·LLM API 필수 (CI 기본 제외 시 integration/e2e 와 함께 참고)",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
