# Epic I — CI에서 유닛·스모크만 실행 (통합/e2e 는 실 API·네트워크 필요)
name: Pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run unit + smoke (exclude integration & e2e)
        run: poetry run pytest backend/tests -m "not integration and not e2e" --no-cov -q
