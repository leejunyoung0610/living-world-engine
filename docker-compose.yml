# 로컬·스테이징용: PostgreSQL + API + 웹(Nginx)
# 사용법: docs/BETA_DEV_EXECUTION.md / README 「Docker」절 참고
#
# 소스 수정 후 UI/API에 반영하려면 이미지를 다시 빌드해야 함(볼륨 마운트 없음):
#   docker compose build web api && docker compose up -d --force-recreate web api
# 또는 README처럼: docker compose up --build -d
# PWA 적용 후에도 예전 화면이면 탭을 모두 닫았다가 다시 열거나, 사이트 설정에서 저장 공간/캐시 삭제.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: living_world
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d living_world"]
      interval: 3s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/living_world
      DEBUG: "false"
      # `.env` 의 CORS_ORIGINS 가 있으면 그걸 씀(휴대폰: http://맥LAN_IP:8080 추가)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000,http://172.16.100.133:8080,http://172.16.100.133:8000}
      HOST: 0.0.0.0
      PORT: "8000"
    env_file:
      - .env
    volumes:
      - engine_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  engine_data:
